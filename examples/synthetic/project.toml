[project]
name = "Synthetic sky-city example"
source_root = "input/source"
baseline_root = "input/baseline"
release_root = "release"
work_root = "work"
reports_root = "reports"
references = ["reference/glossary.tsv", "reference/rules.md"]
delimiter = "|"
markers = ["<<", ">>", "[[", "]]", "((", "))", "##", "#"]
