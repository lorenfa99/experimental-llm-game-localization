[[pairs]]
key = "dialogue"
source = "dialogue_en.txt"
baseline = "dialogue_it.txt"
output = "dialogue_it.txt"
schema = "dialogue_3"
id_field = 0
translatable_fields = [1]
field_labels = ["text"]
confidence = "explicit"
opaque_reference = "source"
