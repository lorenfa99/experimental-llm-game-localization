[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimental-llm-game-localization"
version = "0.2.0"
description = "Versioned, agent-orchestrated game localization with independent review and offline candidate verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lorenzo" }]
dependencies = []

[project.optional-dependencies]
fonts = ["fonttools==4.53.1"]

[project.scripts]
locpipe = "locpipe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["locpipe*"]

[tool.setuptools.package-data]
locpipe = ["templates/**/*", "templates/project/.gitignore"]
